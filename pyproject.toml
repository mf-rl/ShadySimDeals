[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shady-sim-deals"
version = "0.1.0"
description = "A darkly satirical The Sims 4 script mod"
requires-python = ">=3.7"

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
